<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="사육기록장" />
<meta name="theme-color" content="#F4F0E8" />
<title>사육기록장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<!-- 제목용 손글씨체: JS보다 먼저 문서 단계에서 받아오도록 head에 선언 -->
<link rel="preload" as="font" type="font/woff" crossorigin
      href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff" />
<style>
@font-face{font-family:'Cafe24SsurroundAir';
src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24SsurroundAir.woff') format('woff');
font-weight:normal;font-style:normal;font-display:swap}
</style>
<link rel="apple-touch-icon" href="icons/app-icon-180.png" />
<link rel="icon" type="image/png" href="icons/app-icon-180.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#F4F0E8}
#root{min-height:100vh}
.boot{padding:80px 20px;text-align:center;color:#8A8378;font-family:-apple-system,sans-serif;line-height:1.7}
</style>
</head>
<body>
<div id="root"><div class="boot">불러오는 중…</div></div>

<!-- 폰 저장소(IndexedDB) 헬퍼 -->
<script>
function idbOpen(){return new Promise(function(res,rej){var req=indexedDB.open("beetlelog-db",1);req.onupgradeneeded=function(){req.result.createObjectStore("kv");};req.onsuccess=function(){res(req.result);};req.onerror=function(){rej(req.error);};});}
async function idbGet(key){var db=await idbOpen();return new Promise(function(res,rej){var tx=db.transaction("kv","readonly").objectStore("kv").get(key);tx.onsuccess=function(){res(tx.result||null);};tx.onerror=function(){rej(tx.error);};});}
async function idbSet(key,val){var db=await idbOpen();return new Promise(function(res,rej){var tx=db.transaction("kv","readwrite").objectStore("kv").put(val,key);tx.onsuccess=function(){res(true);};tx.onerror=function(){rej(tx.error);};});}
var XLSX = window.XLSX;
/* 앱(app.js)이 뜨기 전에 뒤로가기를 누르면 페이지를 벗어나 새로고침이 일어나므로,
   문서 단계에서 미리 히스토리 트랩을 깔아둠. 앱이 준비되면 앱의 핸들러가 이어받음 */
try {
  history.pushState({ blEarly: 1 }, "");
  window.addEventListener("popstate", function () {
    if (window.__blAppReady) return;              /* 앱이 준비됐으면 앱이 처리 */
    try { history.pushState({ blEarly: 1 }, ""); } catch (e) {}
  });
} catch (e) {}
</script>

<!-- ①②③ 설정값·디자인·앱 본체를 모두 캐시 없이 최신으로 로드 -->
<script>
(async function () {
  function run(code) { var s = document.createElement("script"); s.text = code; document.body.appendChild(s); }
  try {
    var v = Date.now();
    /* ① 설정값 → ② 디자인 → ③ 앱 본체 순서로 (순서 중요) */
    for (var i = 0; i < 2; i++) {
      var f = ["data.js", "styles.js"][i];
      var r = await fetch(f + "?v=" + v);
      if (!r.ok) throw new Error(f + " 로드 실패 (" + r.status + ")");
      run(await r.text());
    }
    var res = await fetch("app.js?v=" + v);
    if (!res.ok) throw new Error("app.js 로드 실패 (" + res.status + ")");
    var code = await res.text();
    run(Babel.transform(code, { presets: ["react"] }).code);
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<div class="boot">앱을 불러오지 못했어요.<br>잠시 후 새로고침해 주세요.<br><br><small style="color:#B4503F">' + (e && e.message ? e.message : e) + '</small></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
